version: '3.8'

services:
  api:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: taskflow-api
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=TaskFlow API
      - SECRET_KEY=supersecretkeyforlocaldevelopmentonly1234567890
      - ACCESS_TOKEN_EXPIRE_MINUTES=11520
      - BACKEND_CORS_ORIGINS=["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:8000", "http://localhost:5500"]
    volumes:
      - ./task-manager-api/taskflow.db:/app/taskflow.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./task-manager-frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
</head>
<body class="dashboard-page">
    <div class="animated-bg"></div>

    <div class="dashboard-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-card">
            <div class="sidebar-brand">
                <h2>TaskFlow</h2>
            </div>
            
            <nav class="sidebar-nav">
                <p class="nav-label">VIEWS</p>
                <button class="nav-btn active" data-filter="ALL" onclick="filterTasks('ALL')">
                    <span class="icon">⊞</span> All Tasks
                </button>
                <button class="nav-btn" data-filter="PENDING" onclick="filterTasks('PENDING')">
                    <span class="icon">○</span> Pending
                </button>
                <button class="nav-btn" data-filter="IN_PROGRESS" onclick="filterTasks('IN_PROGRESS')">
                    <span class="icon">◐</span> In Progress
                </button>
                <button class="nav-btn" data-filter="COMPLETED" onclick="filterTasks('COMPLETED')">
                    <span class="icon">●</span> Completed
                </button>
                <button class="nav-btn" data-filter="CALENDAR" onclick="toggleCalendarView()">
                    <span class="icon">📅</span> Calendar
                </button>
                <div class="nav-divider"></div>
                <button class="nav-btn" onclick="openCategoryModal()">
                    <span class="icon">🏷️</span> Manage Categories
                </button>
                <button class="nav-btn" onclick="openTagModal()">
                    <span class="icon">🔖</span> Manage Tags
                </button>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- Top Navbar -->
            <header class="top-nav glass-header">
                <h2 id="current-view-title">All Tasks</h2>
                
                <!-- Search Bar -->
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Search tasks..." oninput="handleSearch(event)">
                </div>

                <div class="user-profile">
                    <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
                    <span class="avatar">👤</span>
                    <span id="user-email">User</span>
                    <button class="btn-outline btn-sm" onclick="logout()">Logout</button>
                </div>
            </header>

            <!-- Dashboard Stats -->
            <div class="dashboard-stats">
                <div class="stat-card total-card">
                    <div class="stat-icon">📋</div>
                    <div class="stat-info">
                        <h3>Total Tasks</h3>
                        <p id="stat-total">0</p>
                    </div>
                </div>
                <div class="stat-card pending-card">
                    <div class="stat-icon">⏳</div>
                    <div class="stat-info">
                        <h3>Pending</h3>
                        <p id="stat-pending">0</p>
                    </div>
                </div>
                <div class="stat-card completed-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-info">
                        <h3>Completed</h3>
                        <p id="stat-completed">0</p>
                    </div>
                </div>
                <div class="stat-card overdue-card">
                    <div class="stat-icon">⚠️</div>
                    <div class="stat-info">
                        <h3>Overdue</h3>
                        <p id="stat-overdue">0</p>
                    </div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="filters">
                    <select id="filter-priority" onchange="applyFilters()">
                        <option value="">All Priorities</option>
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                        <option value="CRITICAL">Critical</option>
                    </select>
                    <select id="filter-category" onchange="applyFilters()">
                        <option value="">All Categories</option>
                        <!-- Categories injected here -->
                    </select>
                </div>
                <div class="sorting">
                    <select id="sort-select" onchange="applyFilters()">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="due_date">Due Date</option>
                        <option value="priority">Priority</option>
                        <option value="alphabetically">A-Z</option>
                    </select>
                </div>
            </div>

            <!-- Tasks Container -->
            <div class="tasks-scroll-area" id="main-scroll-area">
                <div id="tasks-container">
                    <!-- Tasks injected by JS -->
                </div>
                <div id="calendar-container" style="display: none; height: 100%; min-height: 500px; padding: 20px; background: rgba(255, 255, 255, 0.05); border-radius: 12px;"></div>
            </div>

            <!-- Floating Action Button (FAB) -->
            <button class="fab" onclick="openModal()" title="Add New Task">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </button>

        </main>
    </div>

    <!-- Create/Edit Task Modal -->
    <div id="task-modal" class="modal-overlay">
        <div class="glass-card modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Create New Task</h3>
                <button class="btn-icon close-modal" onclick="closeModal('task-modal')">✕</button>
            </div>
            <form id="task-form" onsubmit="saveTask(event)">
                <input type="hidden" id="task-id">
                <div class="input-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" required placeholder="What needs to be done?">
                </div>
                <div class="input-group">
                    <label for="task-desc">Description (Optional)</label>
                    <textarea id="task-desc" placeholder="Add some details..." rows="3"></textarea>
                </div>
                <div class="input-row">
                    <div class="input-group" style="min-width: 100px;">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="LOW">Low</option>
                            <option value="MEDIUM" selected>Medium</option>
                            <option value="HIGH">High</option>
                            <option value="CRITICAL">Critical</option>
                        </select>
                    </div>
                    <div class="input-group" style="min-width: 120px;">
                        <label for="task-status">Status</label>
                        <select id="task-status">
                            <option value="PENDING">Pending</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="CANCELLED">Cancelled</option>
                        </select>
                    </div>
                    <div class="input-group" style="min-width: 150px;">
                        <label for="task-due-date">Due Date (Optional)</label>
                        <input type="datetime-local" id="task-due-date">
                    </div>
                    <div class="input-group" style="min-width: 150px;">
                        <label for="task-remind-at">Remind At (Optional)</label>
                        <input type="datetime-local" id="task-remind-at">
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label for="task-category">Category (Optional)</label>
                        <select id="task-category">
                            <option value="">None</option>
                            <!-- Categories injected here -->
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="task-tags">Tags (Optional)</label>
                        <select id="task-tags" multiple style="height: auto; min-height: 42px;">
                            <!-- Tags injected here -->
                        </select>
                    </div>
                </div>
                
                <div id="subtasks-section" style="display: none; margin-bottom: 1rem;">
                    <h4>Subtasks</h4>
                    <div id="subtasks-list" style="margin-bottom: 0.5rem; max-height: 150px; overflow-y: auto;">
                        <!-- Subtasks injected here -->
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="new-subtask-title" placeholder="New subtask..." style="flex: 1; padding: 8px; border-radius: 4px; border: 1px solid var(--border-color);">
                        <button type="button" class="btn-outline btn-sm" onclick="addSubtask()">Add</button>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Manage Categories Modal -->
    <div id="category-modal" class="modal-overlay">
        <div class="glass-card modal-content">
            <div class="modal-header">
                <h3>Manage Categories</h3>
                <button class="btn-icon close-modal" onclick="closeCategoryModal()">✕</button>
            </div>
            
            <form id="category-form" onsubmit="saveCategory(event)" style="margin-bottom: 20px;">
                <div class="input-row" style="align-items: center; flex-wrap: wrap;">
                    <div class="input-group" style="flex: 1; min-width: 180px; margin-bottom: 8px;">
                        <input type="text" id="new-category-name" required placeholder="New Category Name">
                    </div>
                    <div class="color-swatches" id="category-color-swatches" style="margin-bottom: 8px;">
                        <button type="button" class="swatch active" data-color="#8b5cf6" style="background: #8b5cf6;" title="Purple"></button>
                        <button type="button" class="swatch" data-color="#3b82f6" style="background: #3b82f6;" title="Blue"></button>
                        <button type="button" class="swatch" data-color="#06b6d4" style="background: #06b6d4;" title="Cyan"></button>
                        <button type="button" class="swatch" data-color="#10b981" style="background: #10b981;" title="Green"></button>
                        <button type="button" class="swatch" data-color="#f59e0b" style="background: #f59e0b;" title="Amber"></button>
                        <button type="button" class="swatch" data-color="#f43f5e" style="background: #f43f5e;" title="Rose"></button>
                        <button type="button" class="swatch" data-color="#f97316" style="background: #f97316;" title="Orange"></button>
                        <button type="button" class="swatch" data-color="#64748b" style="background: #64748b;" title="Slate"></button>
                    </div>
                    <input type="hidden" id="new-category-color" value="#8b5cf6">
                    <button type="submit" class="btn-primary" style="margin-bottom: 8px;">Add</button>
                </div>
            </form>

            <div class="categories-list-container" style="max-height: 200px; overflow-y: auto;">
                <ul id="categories-list" class="styled-list">
                    <!-- Categories injected here -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Manage Tags Modal -->
    <div id="tag-modal" class="modal-overlay">
        <div class="glass-card modal-content">
            <div class="modal-header">
                <h3>Manage Tags</h3>
                <button class="btn-icon close-modal" onclick="closeTagModal()">✕</button>
            </div>
            
            <form id="tag-form" onsubmit="saveTag(event)" style="margin-bottom: 20px;">
                <div class="input-row" style="align-items: center; flex-wrap: wrap;">
                    <div class="input-group" style="flex: 1; min-width: 180px; margin-bottom: 8px;">
                        <input type="text" id="new-tag-name" required placeholder="New Tag Name">
                    </div>
                    <div class="color-swatches" id="tag-color-swatches" style="margin-bottom: 8px;">
                        <button type="button" class="swatch active" data-color="#10b981" style="background: #10b981;" title="Green"></button>
                        <button type="button" class="swatch" data-color="#3b82f6" style="background: #3b82f6;" title="Blue"></button>
                        <button type="button" class="swatch" data-color="#06b6d4" style="background: #06b6d4;" title="Cyan"></button>
                        <button type="button" class="swatch" data-color="#8b5cf6" style="background: #8b5cf6;" title="Purple"></button>
                        <button type="button" class="swatch" data-color="#f59e0b" style="background: #f59e0b;" title="Amber"></button>
                        <button type="button" class="swatch" data-color="#f43f5e" style="background: #f43f5e;" title="Rose"></button>
                        <button type="button" class="swatch" data-color="#f97316" style="background: #f97316;" title="Orange"></button>
                        <button type="button" class="swatch" data-color="#64748b" style="background: #64748b;" title="Slate"></button>
                    </div>
                    <input type="hidden" id="new-tag-color" value="#10b981">
                    <button type="submit" class="btn-primary" style="margin-bottom: 8px;">Add</button>
                </div>
            </form>

            <div class="tags-list-container" style="max-height: 200px; overflow-y: auto;">
                <ul id="tags-list" class="styled-list">
                    <!-- Tags injected here -->
                </ul>
            </div>
        </div>
    </div>


    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <!-- Focus Mode Modal -->
    <div id="focus-modal" class="modal-overlay focus-overlay">
        <div class="focus-content">
            <h2 id="focus-task-title">Task Title</h2>
            <div class="timer-display" id="focus-timer">25:00</div>
            <div class="focus-controls">
                <button class="btn-icon focus-btn" id="focus-play-btn" onclick="toggleFocusTimer()">▶</button>
                <button class="btn-icon focus-btn stop" onclick="closeFocusMode()">⏹</button>
            </div>
        </div>
    </div>

    <!-- Indian Monument Watermark Backdrop -->
    <div class="monument-backdrop">
        <svg viewBox="0 0 300 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <!-- India Gate Line Art -->
            <path d="M 40 260 L 40 160 L 65 160 L 65 260 M 115 260 L 115 160 L 140 160 L 140 260 M 65 190 A 25 25 0 0 1 115 190 M 30 160 L 150 160 L 150 148 L 30 148 Z M 35 148 L 145 148 L 145 100 L 35 100 Z M 48 100 L 132 100 L 132 75 L 48 75 Z M 60 75 L 120 75 L 120 62 L 60 62 Z M 72 62 L 108 62 L 102 48 L 78 48 Z" />
            <!-- Taj Mahal / Dome outline -->
            <path d="M 180 260 L 180 200 L 280 200 L 280 260 M 200 200 L 200 170 C 200 140, 215 130, 230 130 C 245 130, 260 140, 260 200 M 230 130 C 230 115, 225 100, 230 90 C 235 100, 230 115, 230 130 M 165 260 L 165 150 M 160 150 L 170 150 M 165 150 L 165 140 M 295 260 L 295 150 M 290 150 L 300 150 M 295 150 L 295 140" />
            <!-- Base Ground Line -->
            <path d="M 10 260 L 290 260" stroke-width="2" />
        </svg>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>

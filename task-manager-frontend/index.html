<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              primary: { DEFAULT: '#1E3A5F', hover: '#152A45', dark: '#3B82F6', darkhover: '#60A5FA' },
              secondary: { DEFAULT: '#0F766E', dark: '#14B8A6' },
              accent: { DEFAULT: '#1B5E20', dark: '#4ADE80' },
              danger: { DEFAULT: '#991B1B', dark: '#EF4444' }
            }
          }
        }
      }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center font-sans bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-300">
    
    <button class="fixed top-5 right-5 z-[100] w-10 h-10 rounded-full flex items-center justify-center bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:scale-110 transition-transform shadow-sm text-lg" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
    
    <div class="animated-bg"></div>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="w-full max-w-[420px] p-6 z-10 relative">
        <div class="p-8 sm:p-10 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl transition-colors duration-300">
            
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 shadow-sm mb-4">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary dark:text-primary-dark"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Welcome to TaskFlow</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400">Organize your work, effortlessly.</p>
            </div>

            <div class="flex gap-1 mb-6 p-1 bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-lg">
                <button type="button" class="tab active flex-1 py-2 rounded-md text-sm font-medium transition-all bg-primary dark:bg-primary-dark text-white shadow-sm" onclick="switchAuthTab('login')">Login</button>
                <button type="button" class="tab flex-1 py-2 rounded-md text-sm font-medium transition-all text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white" onclick="switchAuthTab('register')">Register</button>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="mb-4">
                    <label for="email" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wide">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com" class="w-full px-3 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 dark:focus:ring-primary-dark/50 focus:border-primary dark:focus:border-primary-dark transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500 text-slate-900 dark:text-slate-100 shadow-sm">
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wide">Password</label>
                    <div class="relative">
                        <input type="password" id="password" required minlength="8" placeholder="••••••••" class="w-full pl-3 pr-10 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 dark:focus:ring-primary-dark/50 focus:border-primary dark:focus:border-primary-dark transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500 text-slate-900 dark:text-slate-100 shadow-sm">
                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors" onclick="togglePassword()" title="Toggle Password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eye-icon">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <p id="auth-error" class="text-danger dark:text-danger-dark text-xs text-center min-h-[18px] mb-3 font-medium"></p>
                <button type="submit" id="auth-submit" class="w-full py-2.5 bg-primary hover:bg-primary-hover dark:bg-primary-dark dark:hover:bg-primary-darkhover text-white rounded-lg text-sm font-medium shadow-md hover:shadow-lg transition-all active:scale-[0.98]">Login</button>
            </form>
            
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <!-- Indian Monument Watermark Backdrop -->
    <div class="monument-backdrop">
        <svg viewBox="0 0 300 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <!-- India Gate Line Art -->
            <path d="M 40 260 L 40 160 L 65 160 L 65 260 M 115 260 L 115 160 L 140 160 L 140 260 M 65 190 A 25 25 0 0 1 115 190 M 30 160 L 150 160 L 150 148 L 30 148 Z M 35 148 L 145 148 L 145 100 L 35 100 Z M 48 100 L 132 100 L 132 75 L 48 75 Z M 60 75 L 120 75 L 120 62 L 60 62 Z M 72 62 L 108 62 L 102 48 L 78 48 Z" />
            <!-- Taj Mahal / Dome outline -->
            <path d="M 180 260 L 180 200 L 280 200 L 280 260 M 200 200 L 200 170 C 200 140, 215 130, 230 130 C 245 130, 260 140, 260 200 M 230 130 C 230 115, 225 100, 230 90 C 235 100, 230 115, 230 130 M 165 260 L 165 150 M 160 150 L 170 150 M 165 150 L 165 140 M 295 260 L 295 150 M 290 150 L 300 150 M 295 150 L 295 140" />
            <!-- Base Ground Line -->
            <path d="M 10 260 L 290 260" stroke-width="2" />
        </svg>
    </div>

    <script src="auth.js"></script>
</body>
</html>

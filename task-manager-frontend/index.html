<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
</head>
<body class="auth-page">
    <button class="theme-toggle-btn" style="position: fixed; top: 20px; right: 20px; z-index: 100;" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
    <div class="animated-bg"></div>
    <div class="auth-split-layout">
        
        <!-- Left Side: Branding / Aesthetic -->
        <div class="auth-brand">
            <div class="brand-content">
                <h1>TaskFlow</h1>
                <p>Organize your work, effortlessly.<br>The professional way to get things done.</p>
            </div>
            <!-- Decorative Elements -->
            <div class="glass-orb orb-1"></div>
            <div class="glass-orb orb-2"></div>
        </div>

        <!-- Right Side: Forms -->
        <div class="auth-form-container">
            <div class="glass-card auth-card">
                <h2>Welcome Back</h2>
                <p class="subtitle">Enter your credentials to access your dashboard.</p>
                
                <div class="tabs">
                    <button class="tab active" onclick="switchAuthTab('login')">Login</button>
                    <button class="tab" onclick="switchAuthTab('register')">Register</button>
                </div>

                <form id="auth-form" onsubmit="handleAuth(event)">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required placeholder="you@example.com">
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" required minlength="8" placeholder="••••••••">
                            <button type="button" class="toggle-password-btn" onclick="togglePassword()" title="Toggle Password">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eye-icon">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <p id="auth-error" class="error-msg"></p>
                    <button type="submit" class="btn-primary" id="auth-submit">Login</button>
                </form>
            </div>
        </div>

    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <!-- Indian Monument Watermark Backdrop -->
    <div class="monument-backdrop">
        <svg viewBox="0 0 300 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <!-- India Gate Line Art -->
            <path d="M 40 260 L 40 160 L 65 160 L 65 260 M 115 260 L 115 160 L 140 160 L 140 260 M 65 190 A 25 25 0 0 1 115 190 M 30 160 L 150 160 L 150 148 L 30 148 Z M 35 148 L 145 148 L 145 100 L 35 100 Z M 48 100 L 132 100 L 132 75 L 48 75 Z M 60 75 L 120 75 L 120 62 L 60 62 Z M 72 62 L 108 62 L 102 48 L 78 48 Z" />
            <!-- Taj Mahal / Dome outline -->
            <path d="M 180 260 L 180 200 L 280 200 L 280 260 M 200 200 L 200 170 C 200 140, 215 130, 230 130 C 245 130, 260 140, 260 200 M 230 130 C 230 115, 225 100, 230 90 C 235 100, 230 115, 230 130 M 165 260 L 165 150 M 160 150 L 170 150 M 165 150 L 165 140 M 295 260 L 295 150 M 290 150 L 300 150 M 295 150 L 295 140" />
            <!-- Base Ground Line -->
            <path d="M 10 260 L 290 260" stroke-width="2" />
        </svg>
    </div>

    <script src="auth.js"></script>
</body>
</html>
